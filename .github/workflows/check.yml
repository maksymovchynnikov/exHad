name: Checks
on: [push, pull_request]
jobs:
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy scipy numba sympy particle==1.0.1 pyhepmc
      - name: Check Python syntax
        run: python -m compileall -q exhad tools tests
      # Without a Pythia8.317 build the live physics tests (tests/test_physics.py) skip; see the physics job.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  physics:
    # The golden digests in tests/golden_digests.json are same-seed sha256 recorded on macOS arm64
    # (Apple clang, Python 3.14, the pinned numerical packages below).
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHIA_SHA256: 1ae551d14dac495ddfe6b344792035ebe410fe6c6004d44a335e0ece0e745adf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache the Pythia 8.317 build
        id: pythia
        uses: actions/cache@v4
        with:
          path: ~/pythia8317
          key: pythia-8.317-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHIA_SHA256 }}
      - name: Build Pythia 8.317 from the official tarball
        if: steps.pythia.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pythia8317.tgz" https://pythia.org/releases/pythia83/pythia8317.tgz
          echo "$PYTHIA_SHA256  $RUNNER_TEMP/pythia8317.tgz" | shasum -a 256 -c
          tar xzf "$RUNNER_TEMP/pythia8317.tgz" -C "$HOME"
          cd "$HOME/pythia8317"
          ./configure
          make -j3
          rm -rf tmp
      - name: Install exHad (README; setup fetches inputs, builds, runs make check and the accelerator gates)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install numpy==2.4.6 scipy==1.18.0 numba==0.66.0 sympy==1.14.0 particle==1.0.1 pyhepmc==2.14.0
          python -m pip install -e .
          python tools/setup.py --pythia8-dir "$HOME/pythia8317" --jobs 3
      - name: Unit and live physics tests (no test may skip; no ResourceWarning)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -n ResourceWarning "$RUNNER_TEMP/unittest.log"; then exit 1; fi
          if grep "skipped '" "$RUNNER_TEMP/unittest.log"; then exit 1; fi
