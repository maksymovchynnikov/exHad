[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhad"
# Python packaging requires a version field; exHad carries no release number.
version = "0.0.0"
description = "Hadronic decays of GeV-scale feebly coupled particles with Pythia 8"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.11", "numba>=0.58", "matplotlib>=3.7", "particle>=1.0.1,<2", "pyhepmc>=2.14,<3"]

[project.scripts]
exhad-generate = "exhad.__main__:main"

[tool.setuptools]
packages = ["exhad", "exhad.core", "exhad.dark_photon", "exhad.model1", "exhad.b_l", "exhad.hnl_backends", "exhad.accelerator"]
